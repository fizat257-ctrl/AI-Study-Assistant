<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Study Assistant - Quiz Generator</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: white;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #292d36;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #a8afbf;
    }

    .quiz-card {
      background: #181b21;
      border: 1px solid #292d36;
      border-radius: 16px;
      padding: 30px;
    }

    input {
      width: 100%;
      padding: 14px;

      border: 1px solid #363b46;
      border-radius: 10px;

      background: #101217;
      color: white;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .primary-btn {
      width: 100%;
      margin-top: 15px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .quiz-container {
      margin-top: 30px;

      padding: 20px;

      background: #101217;

      border: 1px solid #292d36;

      border-radius: 10px;

      line-height: 1.7;
    }

    .quiz-container h3 {
      margin-bottom: 15px;
    }

    .question {
      margin-bottom: 25px;
    }

    .question-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .option {
      display: block;
      width: 100%;

      margin-top: 10px;
      padding: 11px;

      border: 1px solid #363b46;
      border-radius: 8px;

      background: #181b21;
      color: white;

      cursor: pointer;
      text-align: left;
    }

    .option:hover {
      border-color: #2563eb;
    }

    .result {
      margin-top: 20px;
      padding: 15px;

      background: #181b21;
      border: 1px solid #292d36;
      border-radius: 8px;

      color: #d7dbe4;
    }

    @media (max-width: 600px) {

      header {
        padding: 17px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 30px 15px;
      }

      .intro h2 {
        font-size: 26px;
      }

      .quiz-card {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <h1>
      🎓 AI Study Assistant
    </h1>

    <button
      class="back-btn"
      onclick="window.location.href='dashboard.html'"
    >
      ← Dashboard
    </button>

  </header>


  <!-- MAIN -->

  <main class="container">


    <section class="intro">

      <h2>
        🧠 Quiz Generator
      </h2>

      <p>
        Enter a topic and test your knowledge.
      </p>

    </section>


    <section class="quiz-card">


      <!-- TOPIC -->

      <input
        id="quizTopic"
        type="text"
        placeholder="Example: C++ Loops"
      >


      <!-- GENERATE -->

      <button
        id="generateButton"
        class="primary-btn"
        type="button"
        onclick="generateQuiz()"
      >
        Generate Quiz
      </button>


      <!-- QUIZ -->

      <div
        id="quizContainer"
        class="quiz-container"
      >

        Your quiz will appear here.

      </div>


    </section>

  </main>


  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script>

    // ==========================================
    // GENERATE QUIZ
    // ==========================================

    function generateQuiz() {

      const topicInput =
        document.getElementById("quizTopic");

      const quizContainer =
        document.getElementById("quizContainer");

      const generateButton =
        document.getElementById("generateButton");


      const topic =
        topicInput.value.trim();


      // ==========================================
      // CHECK TOPIC
      // ==========================================

      if (!topic) {

        quizContainer.innerHTML =
          "Please enter a topic first.";

        return;

      }


      // ==========================================
      // LOADING
      // ==========================================

      quizContainer.innerHTML =
        "🧠 Generating quiz...";


      generateButton.disabled = true;

      generateButton.innerText =
        "Generating Quiz...";


      // ==========================================
      // CREATE SIMPLE QUIZ
      // ==========================================

      setTimeout(function() {


        quizContainer.innerHTML = `

          <h3>
            🧠 Quiz: ${escapeHTML(topic)}
          </h3>

          <div class="question">

            <div class="question-title">
              1. What is the main purpose of studying ${escapeHTML(topic)}?
            </div>

            <button
              class="option"
              onclick="selectAnswer(this, true)"
            >
              A. To understand the topic and apply its concepts
            </button>

            <button
              class="option"
              onclick="selectAnswer(this, false)"
            >
              B. To avoid learning the topic
            </button>

            <button
              class="option"
              onclick="selectAnswer(this, false)"
            >
              C. To memorize without understanding
            </button>

          </div>


          <div class="question">

            <div class="question-title">
              2. What is a good way to learn ${escapeHTML(topic)}?
            </div>

            <button
              class="option"
              onclick="selectAnswer(this, true)"
            >
              A. Practice and review regularly
            </button>

            <button
              class="option"
              onclick="selectAnswer(this, false)"
            >
              B. Never practice
            </button>

            <button
              class="option"
              onclick="selectAnswer(this, false)"
            >
              C. Skip the important concepts
            </button>

          </div>


          <div class="question">

            <div class="question-title">
              3. What should you do after completing a topic?
            </div>

            <button
              class="option"
              onclick="selectAnswer(this, true)"
            >
              A. Test your understanding
            </button>

            <button
              class="option"
              onclick="selectAnswer(this, false)"
            >
              B. Forget everything
            </button>

            <button
              class="option"
              onclick="selectAnswer(this, false)"
            >
              C. Stop studying completely
            </button>

          </div>


          <div
            id="quizResult"
            class="result"
          >
            Answer the questions to test your knowledge.
          </div>

        `;


        generateButton.disabled = false;

        generateButton.innerText =
          "Generate Quiz";


        // ==========================================
        // QUIZ PROGRESS
        // ==========================================

        let quizProgress =
          Number(
            localStorage.getItem(
              "quizProgress"
            )
          ) || 0;


        quizProgress =
          Math.min(
            quizProgress + 20,
            100
          );


        localStorage.setItem(
          "quizProgress",
          quizProgress
        );


        // ==========================================
        // TOPICS STUDIED
        // ==========================================

        let topics =
          Number(
            localStorage.getItem(
              "topicsStudied"
            )
          ) || 0;


        topics += 1;


        localStorage.setItem(
          "topicsStudied",
          topics
        );


        // ==========================================
        // RECENT ACTIVITY
        // ==========================================

        let activities =
          JSON.parse(
            localStorage.getItem(
              "studyActivity"
            ) || "[]"
          );


        activities.push({

          icon: "🧠",

          text:
            `Quiz Generated: ${topic}`,

          time:
            new Date().toLocaleString()

        });


        if (
          activities.length > 20
        ) {

          activities =
            activities.slice(-20);

        }


        localStorage.setItem(
          "studyActivity",
          JSON.stringify(activities)
        );


        // ==========================================
        // UPDATE OVERALL
        // ==========================================

        updateOverallProgress();


      }, 600);

    }


    // ==========================================
    // SELECT ANSWER
    // ==========================================

    function selectAnswer(
      button,
      correct
    ) {

      const result =
        document.getElementById(
          "quizResult"
        );


      if (correct) {

        result.textContent =
          "✅ Correct! Good job.";

      } else {

        result.textContent =
          "❌ Not quite. Review the topic and try again.";

      }

    }


    // ==========================================
    // UPDATE OVERALL PROGRESS
    // ==========================================

    function updateOverallProgress() {

      const tutor =
        getProgress(
          "tutorProgress"
        );


      const summarizer =
        getProgress(
          "summarizerProgress"
        );


      const quiz =
        getProgress(
          "quizProgress"
        );


      const planner =
        getProgress(
          "plannerProgress"
        );


      const flashcards =
        getProgress(
          "flashcardProgress"
        );


      const pdf =
        getProgress(
          "pdfProgress"
        );


      // ==========================================
      // STUDY LIBRARY
      // ==========================================

      const libraryResources =
        JSON.parse(
          localStorage.getItem(
            "studyLibrary"
          ) || "[]"
        );


      let libraryProgress = 0;


      if (
        libraryResources.length > 0
      ) {

        libraryProgress =
          Math.min(
            libraryResources.length * 20,
            100
          );

      }


      // ==========================================
      // OVERALL
      // ==========================================

      const overall =
        Math.round(
          (
            tutor +
            summarizer +
            quiz +
            planner +
            flashcards +
            pdf +
            libraryProgress
          ) / 7
        );


      localStorage.setItem(
        "overallProgress",
        overall
      );

    }


    // ==========================================
    // GET PROGRESS
    // ==========================================

    function getProgress(key) {

      return Math.min(
        Number(
          localStorage.getItem(key)
        ) || 0,
        100
      );

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>


</body>

</html>
