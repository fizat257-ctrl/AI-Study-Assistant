<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Study Assistant - Quiz Generator</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: white;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #292d36;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #a8afbf;
    }

    .quiz-card {
      background: #181b21;
      border: 1px solid #292d36;
      border-radius: 16px;
      padding: 30px;
    }

    input {
      width: 100%;
      padding: 14px;

      border: 1px solid #363b46;
      border-radius: 10px;

      background: #101217;
      color: white;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .primary-btn {
      width: 100%;
      margin-top: 15px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .quiz-container {
      margin-top: 30px;

      padding: 20px;

      background: #101217;

      border: 1px solid #292d36;

      border-radius: 10px;

      line-height: 1.7;
    }

    .quiz-header {
      margin-bottom: 25px;
    }

    .quiz-header h3 {
      margin-bottom: 8px;
    }

    .question-number {
      color: #9ca3af;
      font-size: 14px;
    }

    .question-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      width: 100%;

      margin-top: 12px;
      padding: 13px;

      border: 1px solid #363b46;
      border-radius: 8px;

      background: #181b21;
      color: white;

      cursor: pointer;
      text-align: left;

      transition: 0.2s;
    }

    .option:hover {
      border-color: #2563eb;
    }

    .option:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .correct {
      border-color: #22c55e !important;
    }

    .wrong {
      border-color: #ef4444 !important;
    }

    .next-btn {
      width: 100%;
      margin-top: 20px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #16a34a;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .next-btn:hover {
      opacity: 0.9;
    }

    .feedback {
      margin-top: 18px;
      padding: 12px;

      border-radius: 8px;

      background: #181b21;

      color: #d7dbe4;
    }

    .result {
      margin-top: 10px;
      padding: 25px;

      background: #181b21;
      border: 1px solid #292d36;

      border-radius: 10px;

      text-align: center;
    }

    .result h3 {
      font-size: 26px;
      margin-bottom: 15px;
    }

    .score {
      font-size: 40px;
      font-weight: bold;
      margin: 15px 0;
    }

    .result p {
      margin-top: 8px;
      color: #cbd5e1;
    }

    .restart-btn {
      width: 100%;
      margin-top: 20px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #cbd5e1;
    }

    .error {
      padding: 20px;
      color: #fca5a5;
      background: #2a1515;
      border-radius: 8px;
    }

    @media (max-width: 600px) {

      header {
        padding: 17px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 30px 15px;
      }

      .intro h2 {
        font-size: 26px;
      }

      .quiz-card {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <header>

    <h1>
      🎓 AI Study Assistant
    </h1>

    <button
      class="back-btn"
      onclick="window.location.href='dashboard.html'"
    >
      ← Dashboard
    </button>

  </header>


  <main class="container">

    <section class="intro">

      <h2>
        🧠 Quiz Generator
      </h2>

      <p>
        Enter any topic and let AI create a personalized quiz.
      </p>

    </section>


    <section class="quiz-card">


      <input
        id="quizTopic"
        type="text"
        placeholder="Example: Friction, Periodic Table, C++ Loops, Photosynthesis..."
      >


      <button
        id="generateButton"
        class="primary-btn"
        type="button"
        onclick="generateQuiz()"
      >
        Generate AI Quiz
      </button>


      <div
        id="quizContainer"
        class="quiz-container"
      >

        Your AI-generated quiz will appear here.

      </div>


    </section>

  </main>
  <script>

    // ==================================================
    // QUIZ VARIABLES
    // ==================================================

    let currentQuiz = [];

    let currentQuestionIndex = 0;

    let score = 0;

    let answered = false;

    let currentTopic = "";


    // ==================================================
    // GENERATE QUIZ
    // ==================================================

    async function generateQuiz() {

      const topicInput =
        document.getElementById("quizTopic");

      const quizContainer =
        document.getElementById("quizContainer");

      const generateButton =
        document.getElementById("generateButton");


      if (!topicInput || !quizContainer) {
        return;
      }


      const topic =
        topicInput.value.trim();


      if (!topic) {

        quizContainer.innerHTML =
          '<div class="error">Please enter a topic first.</div>';

        return;
      }


      currentTopic = topic;

      currentQuiz = [];

      currentQuestionIndex = 0;

      score = 0;

      answered = false;


      // ==================================================
      // LOADING
      // ==================================================

      quizContainer.innerHTML = `
        <div class="loading">
          🧠 AI is creating a quiz about
          <strong>${escapeHTML(topic)}</strong>...
          <br><br>
          Please wait.
        </div>
      `;


      generateButton.disabled = true;

      generateButton.innerText =
        "Generating Quiz...";


      try {

        // ==================================================
        // CALL BACKEND
        // ==================================================

        const response =
          await fetch("/api/quiz", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              topic: topic
            })

          });


        const data =
          await response.json();


        // ==================================================
        // ERROR
        // ==================================================

        if (!response.ok || !data.success) {

          throw new Error(
            data.error ||
            "Unable to generate quiz."
          );

        }


        // ==================================================
        // VALIDATE QUIZ
        // ==================================================

        if (
          !Array.isArray(data.quiz) ||
          data.quiz.length === 0
        ) {

          throw new Error(
            "AI returned an empty quiz."
          );

        }


        currentQuiz =
          data.quiz;


        // ==================================================
        // SHOW FIRST QUESTION
        // ==================================================

        showQuestion();


        // ==================================================
        // QUIZ PROGRESS
        // ==================================================

        let quizProgress =
          Number(
            localStorage.getItem(
              "quizProgress"
            )
          ) || 0;


        quizProgress =
          Math.min(
            quizProgress + 20,
            100
          );


        localStorage.setItem(
          "quizProgress",
          quizProgress
        );


        // ==================================================
        // TOPICS STUDIED
        // ==================================================

        let topics =
          Number(
            localStorage.getItem(
              "topicsStudied"
            )
          ) || 0;


        topics += 1;


        localStorage.setItem(
          "topicsStudied",
          topics
        );


        // ==================================================
        // RECENT ACTIVITY
        // ==================================================

        let activities =
          JSON.parse(
            localStorage.getItem(
              "studyActivity"
            ) || "[]"
          );


        activities.push({

          icon: "🧠",

          text:
            "AI Quiz Generated: " + topic,

          time:
            new Date().toLocaleString()

        });


        if (
          activities.length > 20
        ) {

          activities =
            activities.slice(-20);

        }


        localStorage.setItem(
          "studyActivity",
          JSON.stringify(activities)
        );


        updateOverallProgress();


      } catch (error) {

        console.error(
          "QUIZ ERROR:",
          error
        );


        quizContainer.innerHTML = `
          <div class="error">
            ❌ ${escapeHTML(
              error.message ||
              "Something went wrong while generating the quiz."
            )}
          </div>
        `;

      } finally {

        generateButton.disabled = false;

        generateButton.innerText =
          "Generate AI Quiz";

      }

    }


    // ==================================================
    // SHOW QUESTION
    // ==================================================

    function showQuestion() {

      const quizContainer =
        document.getElementById(
          "quizContainer"
        );


      if (!quizContainer) {
        return;
      }


      const question =
        currentQuiz[
          currentQuestionIndex
        ];


      if (!question) {

        showFinalResult();

        return;

      }


      answered = false;


      let optionsHTML = "";


      question.options.forEach(
        function(option, index) {

          optionsHTML += `

            <button
              class="option"
              type="button"
              onclick="selectAnswer(${index}, this)"
            >
              ${escapeHTML(option)}
            </button>

          `;

        }
      );


      quizContainer.innerHTML = `

        <div class="quiz-header">

          <h3>
            🧠 Quiz: ${escapeHTML(currentTopic)}
          </h3>

          <div class="question-number">
            Question
            ${currentQuestionIndex + 1}
            of
            ${currentQuiz.length}
          </div>

        </div>


        <div class="question-title">

          ${escapeHTML(question.question)}

        </div>


        <div>

          ${optionsHTML}

        </div>


        <div
          id="feedback"
          class="feedback"
        >
          Select an answer.
        </div>


        <button
          id="nextButton"
          class="next-btn"
          type="button"
          onclick="nextQuestion()"
          style="display:none;"
        >
          ${
            currentQuestionIndex ===
            currentQuiz.length - 1
              ? "Show Final Score"
              : "Next Question"
          }
        </button>

      `;

    }


    // ==================================================
    // SELECT ANSWER
    // ==================================================

    function selectAnswer(
      selectedIndex,
      selectedButton
    ) {

      if (answered) {
        return;
      }


      answered = true;


      const question =
        currentQuiz[
          currentQuestionIndex
        ];


      const optionButtons =
        document.querySelectorAll(
          ".option"
        );


      optionButtons.forEach(
        function(button) {

          button.disabled = true;

        }
      );


      const feedback =
        document.getElementById(
          "feedback"
        );


      const correctIndex =
        Number(
          question.correctAnswer
        );


      if (
        selectedIndex ===
        correctIndex
      ) {

        score += 1;


        selectedButton.classList.add(
          "correct"
        );


        feedback.innerHTML =
          "✅ Correct! Good job.";

      } else {

        selectedButton.classList.add(
          "wrong"
        );


        if (
          optionButtons[
            correctIndex
          ]
        ) {

          optionButtons[
            correctIndex
          ].classList.add(
            "correct"
          );

        }


        feedback.innerHTML =
          "❌ Incorrect. The correct answer is: " +
          escapeHTML(
            question.options[
              correctIndex
            ]
          );

      }


      const nextButton =
        document.getElementById(
          "nextButton"
        );


      if (nextButton) {

        nextButton.style.display =
          "block";

      }

    }


    // ==================================================
    // NEXT QUESTION
    // ==================================================

    function nextQuestion() {

      if (!answered) {

        return;

      }


      currentQuestionIndex += 1;


      if (
        currentQuestionIndex >=
        currentQuiz.length
      ) {

        showFinalResult();

        return;

      }


      showQuestion();

    }


    // ==================================================
    // FINAL RESULT
    // ==================================================

    function showFinalResult() {

      const quizContainer =
        document.getElementById(
          "quizContainer"
        );


      if (!quizContainer) {
        return;
      }


      const total =
        currentQuiz.length;


      const percentage =
        Math.round(
          (score / total) * 100
        );


      quizContainer.innerHTML = `

        <div class="result">

          <h3>
            🎉 Quiz Completed!
          </h3>

          <div class="score">
            ${score} / ${total}
          </div>

          <p>
            📊 Percentage:
            <strong>${percentage}%</strong>
          </p>

          <p>
            ✅ Correct Answers:
            <strong>${score}</strong>
          </p>

          <p>
            ❌ Incorrect Answers:
            <strong>${total - score}</strong>
          </p>

          <p>
            📚 Topic:
            <strong>${escapeHTML(currentTopic)}</strong>
          </p>


          <button
            class="restart-btn"
            type="button"
            onclick="generateQuiz()"
          >
            🔄 Generate Another Quiz
          </button>

        </div>

      `;


      // ==================================================
      // SAVE QUIZ SCORE
      // ==================================================

      localStorage.setItem(
        "lastQuizScore",
        score
      );


      localStorage.setItem(
        "lastQuizTotal",
        total
      );


      localStorage.setItem(
        "lastQuizPercentage",
        percentage
      );


      // ==================================================
      // ACTIVITY
      // ==================================================

      addQuizResultActivity(
        currentTopic,
        score,
        total,
        percentage
      );

    }
    // ==================================================
    // SAVE QUIZ RESULT IN STUDY ACTIVITY
    // ==================================================

    function addQuizResultActivity(
      topic,
      score,
      total,
      percentage
    ) {

      let activities =
        JSON.parse(
          localStorage.getItem(
            "studyActivity"
          ) || "[]"
        );


      activities.push({

        icon: "🏆",

        text:
          "Quiz completed: " +
          topic +
          " — Score: " +
          score +
          "/" +
          total +
          " (" +
          percentage +
          "%)",

        time:
          new Date().toLocaleString()

      });


      if (
        activities.length > 20
      ) {

        activities =
          activities.slice(-20);

      }


      localStorage.setItem(
        "studyActivity",
        JSON.stringify(activities)
      );

    }


    // ==================================================
    // UPDATE OVERALL PROGRESS
    // ==================================================

    function updateOverallProgress() {

      const tutor =
        getProgress(
          "tutorProgress"
        );


      const summarizer =
        getProgress(
          "summarizerProgress"
        );


      const quiz =
        getProgress(
          "quizProgress"
        );


      const planner =
        getProgress(
          "plannerProgress"
        );


      const flashcards =
        getProgress(
          "flashcardProgress"
        );


      const pdf =
        getProgress(
          "pdfProgress"
        );


      // ==================================================
      // STUDY LIBRARY
      // ==================================================

      const libraryResources =
        JSON.parse(
          localStorage.getItem(
            "studyLibrary"
          ) || "[]"
        );


      let libraryProgress = 0;


      if (
        libraryResources.length > 0
      ) {

        libraryProgress =
          Math.min(
            libraryResources.length * 20,
            100
          );

      }


      // ==================================================
      // OVERALL PROGRESS
      // ==================================================

      const overall =
        Math.round(
          (
            tutor +
            summarizer +
            quiz +
            planner +
            flashcards +
            pdf +
            libraryProgress
          ) / 7
        );


      localStorage.setItem(
        "overallProgress",
        overall
      );

    }


    // ==================================================
    // GET PROGRESS
    // ==================================================

    function getProgress(key) {

      return Math.min(
        Number(
          localStorage.getItem(key)
        ) || 0,
        100
      );

    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHTML(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==================================================
    // ENTER KEY SUPPORT
    // ==================================================

    const quizTopicInput =
      document.getElementById(
        "quizTopic"
      );


    if (quizTopicInput) {

      quizTopicInput.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            generateQuiz();

          }

        }
      );

    }


    // ==================================================
    // INITIAL STATE
    // ==================================================

    console.log(
      "AI Quiz Generator loaded successfully."
    );

  </script>

</body>

</html>
