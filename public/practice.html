<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Study Assistant - Practice Mode</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: white;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #292d36;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #a8afbf;
    }

    .practice-card {
      background: #181b21;
      border: 1px solid #292d36;
      border-radius: 16px;
      padding: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;

      background: #101217;
      color: white;

      border: 1px solid #363b46;
      border-radius: 9px;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .primary-btn {
      width: 100%;
      margin-top: 15px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary-btn {
      width: 100%;
      margin-top: 10px;

      padding: 13px;

      border: 1px solid #363b46;
      border-radius: 9px;

      background: #181b21;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .secondary-btn:hover {
      border-color: #2563eb;
    }

    .question-box {
      margin-top: 30px;

      padding: 25px;

      background: #101217;
      border: 1px solid #292d36;
      border-radius: 12px;
    }

    .question {
      margin-bottom: 20px;
    }

    .question h3 {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .question-text {
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .option {
      display: block;
      width: 100%;

      margin-top: 10px;
      padding: 12px;

      background: #181b21;
      color: white;

      border: 1px solid #363b46;
      border-radius: 8px;

      text-align: left;
      cursor: pointer;
    }

    .option:hover {
      border-color: #2563eb;
    }

    .option.selected {
      border-color: #2563eb;
      background: #1d2740;
    }

    .result {
      margin-top: 25px;

      padding: 25px;

      background: #101217;
      border: 1px solid #292d36;

      border-radius: 10px;

      text-align: center;

      line-height: 1.8;
    }

    .score {
      font-size: 30px;
      font-weight: bold;
      margin: 15px 0;
    }

    .result-message {
      color: #a8afbf;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      header {
        padding: 17px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 30px 15px;
      }

      .intro h2 {
        font-size: 26px;
      }

      .practice-card {
        padding: 20px;
      }

    }

  </style>

</head>

<body>

  <header>

    <h1>
      🎓 AI Study Assistant
    </h1>

    <button
      class="back-btn"
      type="button"
      onclick="window.location.href='dashboard.html'"
    >
      ← Dashboard
    </button>

  </header>

  <main class="container">

    <section class="intro">

      <h2>
        🎯 Practice Mode
      </h2>

      <p>
        Enter any topic and practice with topic-specific questions.
      </p>

    </section>

    <section class="practice-card">

      <label for="practiceTopic">
        Enter Topic
      </label>

      <input
        id="practiceTopic"
        type="text"
        placeholder="Example: Force, Periodic Table, C++ Loops"
      >

      <button
        id="startButton"
        class="primary-btn"
        type="button"
        onclick="startPractice()"
      >
        Start Practice
      </button>

      <div
        id="questionBox"
        class="question-box hidden"
      ></div>

      <div
        id="resultBox"
        class="result hidden"
      ></div>

    </section>

  </main>
  <script>

    // ==========================================
    // PRACTICE VARIABLES
    // ==========================================

    let practiceQuestions = [];

    let currentQuestion = 0;

    let score = 0;

    let selectedAnswer = null;

    let practiceTopic = "";


    // ==========================================
    // START PRACTICE
    // ==========================================

    async function startPractice() {

      const topicInput =
        document.getElementById("practiceTopic");

      const questionBox =
        document.getElementById("questionBox");

      const resultBox =
        document.getElementById("resultBox");

      const startButton =
        document.getElementById("startButton");


      practiceTopic =
        topicInput.value.trim();


      if (!practiceTopic) {

        alert("Please enter a topic.");

        return;

      }


      currentQuestion = 0;

      score = 0;

      selectedAnswer = null;


      resultBox.classList.add("hidden");

      questionBox.classList.remove("hidden");


      questionBox.innerHTML =
        "🤖 Creating questions for " +
        escapeHTML(practiceTopic) +
        "...";


      startButton.disabled = true;

      startButton.innerText =
        "Generating Questions...";


      try {

        const response =
          await fetch("/api/practice", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              topic: practiceTopic,

              numberOfQuestions: 5

            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Unable to generate questions."
          );

        }


        practiceQuestions =
          data.questions;


        if (
          !Array.isArray(practiceQuestions) ||
          practiceQuestions.length === 0
        ) {

          throw new Error(
            "No questions were generated."
          );

        }


        startButton.disabled = false;

        startButton.innerText =
          "Start Practice";


        showQuestion();


      } catch (error) {

        console.error(
          "Practice error:",
          error
        );


        questionBox.innerHTML = `

          <p>
            ❌ Sorry, I could not generate the
            practice questions.
          </p>

          <p style="margin-top:10px;color:#9ca3af;">
            ${escapeHTML(error.message)}
          </p>

        `;


        startButton.disabled = false;

        startButton.innerText =
          "Start Practice";

      }

    }


    // ==========================================
    // SHOW QUESTION
    // ==========================================

    function showQuestion() {

      const questionBox =
        document.getElementById(
          "questionBox"
        );


      if (
        currentQuestion >=
        practiceQuestions.length
      ) {

        finishPractice();

        return;

      }


      selectedAnswer = null;


      const q =
        practiceQuestions[currentQuestion];


      let html = `

        <div class="question">

          <h3>
            Question
            ${currentQuestion + 1}
            of
            ${practiceQuestions.length}
          </h3>

          <p class="question-text">
            ${escapeHTML(q.question)}
          </p>

      `;


      q.options.forEach(
        function(option, index) {

          html += `

            <button
              class="option"
              type="button"
              onclick="selectAnswer(${index})"
            >
              ${String.fromCharCode(65 + index)}.
              ${escapeHTML(option)}
            </button>

          `;

        }
      );


      html += `

          <button
            class="primary-btn"
            type="button"
            onclick="submitAnswer()"
          >
            Submit Answer
          </button>

        </div>

      `;


      questionBox.innerHTML =
        html;

    }


    // ==========================================
    // SELECT ANSWER
    // ==========================================

    function selectAnswer(index) {

      selectedAnswer =
        index;


      const options =
        document.querySelectorAll(
          "#questionBox .option"
        );


      options.forEach(
        function(option, i) {

          option.classList.toggle(
            "selected",
            i === index
          );

        }
      );

    }


    // ==========================================
    // SUBMIT ANSWER
    // ==========================================

    function submitAnswer() {

      if (
        selectedAnswer === null
      ) {

        alert(
          "Please select an answer."
        );

        return;

      }


      const question =
        practiceQuestions[
          currentQuestion
        ];


      if (
        Number(selectedAnswer) ===
        Number(question.answer)
      ) {

        score++;

      }


      currentQuestion++;

      showQuestion();

    }


    // ==========================================
    // FINISH PRACTICE
    // ==========================================

    function finishPractice() {

      const questionBox =
        document.getElementById(
          "questionBox"
        );

      const resultBox =
        document.getElementById(
          "resultBox"
        );


      const total =
        practiceQuestions.length;


      const percentage =
        total > 0
          ? Math.round(
              (score / total) * 100
            )
          : 0;


      questionBox.classList.add(
        "hidden"
      );


      resultBox.classList.remove(
        "hidden"
      );


      let message;


      if (percentage === 100) {

        message =
          "🌟 Excellent! Perfect score!";

      }

      else if (percentage >= 80) {

        message =
          "👏 Great job! You understand this topic well.";

      }

      else if (percentage >= 60) {

        message =
          "👍 Good work! Review a few concepts and try again.";

      }

      else {

        message =
          "📚 Keep practicing! Review the topic and try again.";

      }


      resultBox.innerHTML = `

        <h2>
          🎉 Practice Complete!
        </h2>

        <div class="score">
          ${percentage}%
        </div>

        <p>
          Correct Answers:
          <strong>
            ${score}
          </strong>
          /
          ${total}
        </p>

        <p>
          Wrong Answers:
          <strong>
            ${total - score}
          </strong>
        </p>

        <p class="result-message">
          ${message}
        </p>

        <p>
          Topic:
          <strong>
            ${escapeHTML(practiceTopic)}
          </strong>
        </p>

        <button
          class="primary-btn"
          type="button"
          onclick="startPractice()"
        >
          Practice Again
        </button>

        <button
          class="secondary-btn"
          type="button"
          onclick="viewProgress()"
        >
          📊 View Progress
        </button>

      `;


      // ==========================================
      // SAVE PRACTICE PROGRESS
      // ==========================================

      localStorage.setItem(
        "practiceProgress",
        percentage
      );


      // ==========================================
      // SAVE ACTIVITY
      // ==========================================

      let activities =
        JSON.parse(
          localStorage.getItem(
            "studyActivity"
          ) || "[]"
        );


      activities.push({

        icon: "🎯",

        text:
          "Practice completed: " +
          practiceTopic +
          " - " +
          score +
          "/" +
          total,

        time:
          new Date().toLocaleString()

      });


      if (
        activities.length > 20
      ) {

        activities =
          activities.slice(-20);

      }


      localStorage.setItem(
        "studyActivity",
        JSON.stringify(
          activities
        )
      );


      updateOverallProgress();

    }
    // ==========================================
    // UPDATE OVERALL PROGRESS
    // ==========================================

    function updateOverallProgress() {

      const tutor =
        getProgress("tutorProgress");

      const summarizer =
        getProgress("summarizerProgress");

      const quiz =
        getProgress("quizProgress");

      const planner =
        getProgress("plannerProgress");

      const flashcards =
        getProgress("flashcardProgress");

      const pdf =
        getProgress("pdfProgress");

      const practice =
        getProgress("practiceProgress");


      const libraryResources =
        JSON.parse(
          localStorage.getItem(
            "studyLibrary"
          ) || "[]"
        );


      let libraryProgress = 0;


      if (
        libraryResources.length > 0
      ) {

        libraryProgress =
          Math.min(
            libraryResources.length * 20,
            100
          );

      }


      const overall =
        Math.round(
          (
            tutor +
            summarizer +
            quiz +
            planner +
            flashcards +
            pdf +
            practice +
            libraryProgress
          ) / 8
        );


      localStorage.setItem(
        "overallProgress",
        overall
      );

    }


    // ==========================================
    // GET PROGRESS
    // ==========================================

    function getProgress(key) {

      return Math.min(
        Number(
          localStorage.getItem(key)
        ) || 0,
        100
      );

    }


    // ==========================================
    // VIEW PROGRESS
    // ==========================================

    function viewProgress() {

      window.location.href =
        "progress.html";

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>

</html>
