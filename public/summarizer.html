<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Study Assistant - Note Summarizer</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: white;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #292d36;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #a8afbf;
    }

    .summarizer-card {
      background: #181b21;
      border: 1px solid #292d36;
      border-radius: 16px;
      padding: 30px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;

      padding: 15px;

      border: 1px solid #363b46;
      border-radius: 10px;

      background: #101217;
      color: white;

      font-size: 16px;
      line-height: 1.6;

      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .primary-btn {
      width: 100%;
      margin-top: 15px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .answer-section {
      margin-top: 30px;
    }

    .answer-section h3 {
      margin-bottom: 12px;
    }

    .answer-box {
      min-height: 150px;

      padding: 20px;

      background: #101217;

      border: 1px solid #292d36;

      border-radius: 10px;

      color: #d7dbe4;

      line-height: 1.7;

      white-space: pre-wrap;
    }

    @media (max-width: 600px) {

      header {
        padding: 17px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 30px 15px;
      }

      .intro h2 {
        font-size: 26px;
      }

      .summarizer-card {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <h1>
      🎓 AI Study Assistant
    </h1>

    <button
      class="back-btn"
      onclick="window.location.href='dashboard.html'"
    >
      ← Dashboard
    </button>

  </header>


  <!-- MAIN -->

  <main class="container">


    <section class="intro">

      <h2>
        📝 Note Summarizer
      </h2>

      <p>
        Paste your study notes and create a simple summary.
      </p>

    </section>


    <section class="summarizer-card">


      <!-- NOTES -->

      <textarea
        id="notesInput"
        placeholder="Paste your study notes here..."
      ></textarea>


      <!-- BUTTON -->

      <button
        class="primary-btn"
        id="summarizeButton"
        type="button"
        onclick="summarizeNotes()"
      >
        Summarize Notes
      </button>


      <!-- SUMMARY -->

      <div class="answer-section">

        <h3>
          📝 Summary
        </h3>

        <div
          id="summary"
          class="answer-box"
        >
          Your summary will appear here.
        </div>

      </div>


    </section>

  </main>


  <!-- ==========================================
       NOTE SUMMARIZER + PROGRESS
  =========================================== -->

  <script>

    function summarizeNotes() {

      const notesInput =
        document.getElementById("notesInput");

      const summary =
        document.getElementById("summary");

      const button =
        document.getElementById("summarizeButton");


      if (!notesInput || !summary) {
        return;
      }


      const notes =
        notesInput.value.trim();


      // Empty notes
      if (notes === "") {

        summary.innerText =
          "Please paste your study notes first.";

        return;
      }


      // Loading
      summary.innerText =
        "📝 Creating summary...";

      if (button) {
        button.disabled = true;
        button.innerText = "Creating Summary...";
      }


      setTimeout(function () {

        const words =
          notes.split(/\s+/);


        let shortSummary =
          words.slice(0, 60).join(" ");


        if (words.length > 60) {
          shortSummary += "...";
        }


        summary.innerText =
          "📝 Study Summary\n\n" +
          shortSummary +
          "\n\n" +
          "💡 Study Tip:\n" +
          "Review the main concepts and important keywords from these notes.";


        if (button) {
          button.disabled = false;
          button.innerText = "Summarize Notes";
        }


        // ==========================================
        // RECENT ACTIVITY
        // ==========================================

        let activities =
          JSON.parse(
            localStorage.getItem("studyActivity") || "[]"
          );


        activities.push({

          icon: "📝",

          text: "Note Summary Created",

          time: new Date().toLocaleString()

        });


        // Latest 20 activities
        if (activities.length > 20) {

          activities =
            activities.slice(-20);

        }


        localStorage.setItem(
          "studyActivity",
          JSON.stringify(activities)
        );


        // ==========================================
        // OVERALL LEARNING
        // ==========================================

        const tutorProgress =
          Number(
            localStorage.getItem("tutorProgress")
          ) || 0;


        const flashcardProgress =
          Number(
            localStorage.getItem("flashcardProgress")
          ) || 0;


        const overall =
          Math.round(
            (
              tutorProgress +
              flashcardProgress
            ) / 2
          );


        localStorage.setItem(
          "overallProgress",
          overall
        );


      }, 600);

    }

  </script>


</body>

</html>
