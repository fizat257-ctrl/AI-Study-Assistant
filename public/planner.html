<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Study Assistant - Study Planner</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: white;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #292d36;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #a8afbf;
    }

    .planner-card {
      background: #181b21;
      border: 1px solid #292d36;
      border-radius: 16px;
      padding: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d7dbe4;
      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 14px;
      margin-bottom: 18px;

      border: 1px solid #363b46;
      border-radius: 10px;

      background: #101217;
      color: white;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .primary-btn {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 9px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .primary-btn:hover {
      opacity: 0.9;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .plan-section {
      margin-top: 30px;
    }

    .plan-section h3 {
      margin-bottom: 12px;
    }

    .plan-box {
      min-height: 150px;

      padding: 20px;

      background: #101217;

      border: 1px solid #292d36;

      border-radius: 10px;

      color: #d7dbe4;

      line-height: 1.8;

      white-space: pre-wrap;
    }

    @media (max-width: 600px) {

      header {
        padding: 17px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 30px 15px;
      }

      .intro h2 {
        font-size: 26px;
      }

      .planner-card {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <h1>
      🎓 AI Study Assistant
    </h1>

    <button
      class="back-btn"
      onclick="window.location.href='dashboard.html'"
    >
      ← Dashboard
    </button>

  </header>


  <!-- MAIN -->

  <main class="container">


    <section class="intro">

      <h2>
        📅 Study Planner
      </h2>

      <p>
        Create a simple study plan based on your subject and available time.
      </p>

    </section>


    <section class="planner-card">


      <!-- SUBJECT -->

      <label for="subject">
        Subject
      </label>

      <input
        id="subject"
        type="text"
        placeholder="Example: Programming Fundamentals"
      >


      <!-- TIME -->

      <label for="studyTime">
        Study Time (minutes)
      </label>

      <input
        id="studyTime"
        type="number"
        min="1"
        placeholder="Example: 60"
      >


      <!-- BUTTON -->

      <button
        id="planButton"
        class="primary-btn"
        type="button"
        onclick="createStudyPlan()"
      >
        Create Study Plan
      </button>


      <!-- PLAN -->

      <div class="plan-section">

        <h3>
          📚 Your Study Plan
        </h3>

        <div
          id="studyPlan"
          class="plan-box"
        >
          Your study plan will appear here.
        </div>

      </div>


    </section>

  </main>


  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script>


    // ==========================================
    // CREATE STUDY PLAN
    // ==========================================

    function createStudyPlan() {

      const subjectInput =
        document.getElementById("subject");

      const timeInput =
        document.getElementById("studyTime");

      const studyPlan =
        document.getElementById("studyPlan");

      const planButton =
        document.getElementById("planButton");


      const subject =
        subjectInput.value.trim();


      const minutes =
        Number(
          timeInput.value
        );


      // ==========================================
      // VALIDATION
      // ==========================================

      if (!subject) {

        studyPlan.innerText =
          "Please enter a subject.";

        return;

      }


      if (!minutes || minutes < 1) {

        studyPlan.innerText =
          "Please enter a valid study time.";

        return;

      }


      // ==========================================
      // LOADING
      // ==========================================

      studyPlan.innerText =
        "📅 Creating your study plan...";


      planButton.disabled = true;

      planButton.innerText =
        "Creating Plan...";


      // ==========================================
      // CREATE PLAN
      // ==========================================

      setTimeout(function() {


        let firstPart =
          Math.round(
            minutes * 0.4
          );


        let secondPart =
          Math.round(
            minutes * 0.35
          );


        let thirdPart =
          minutes -
          firstPart -
          secondPart;


        studyPlan.innerText =

          `📚 Study Plan: ${subject}\n\n` +

          `1️⃣ Learn Concepts — ${firstPart} minutes\n` +
          `Review the main concepts and important definitions.\n\n` +

          `2️⃣ Practice — ${secondPart} minutes\n` +
          `Solve examples, questions, or practical exercises.\n\n` +

          `3️⃣ Revision — ${thirdPart} minutes\n` +
          `Review what you learned and test your understanding.\n\n` +

          `💡 Study Tip:\n` +
          `Take short breaks and focus on one topic at a time.`;


        planButton.disabled = false;

        planButton.innerText =
          "Create Study Plan";


        // ==========================================
        // PLANNER PROGRESS
        // ==========================================

        let plannerProgress =
          Number(
            localStorage.getItem(
              "plannerProgress"
            )
          ) || 0;


        plannerProgress =
          Math.min(
            plannerProgress + 20,
            100
          );


        localStorage.setItem(
          "plannerProgress",
          plannerProgress
        );


        // ==========================================
        // TOPICS STUDIED
        // ==========================================

        let topics =
          Number(
            localStorage.getItem(
              "topicsStudied"
            )
          ) || 0;


        topics += 1;


        localStorage.setItem(
          "topicsStudied",
          topics
        );


        // ==========================================
        // RECENT ACTIVITY
        // ==========================================

        let activities =
          JSON.parse(
            localStorage.getItem(
              "studyActivity"
            ) || "[]"
          );


        activities.push({

          icon: "📅",

          text:
            `Study Plan Created: ${subject}`,

          time:
            new Date().toLocaleString()

        });


        if (
          activities.length > 20
        ) {

          activities =
            activities.slice(-20);

        }


        localStorage.setItem(
          "studyActivity",
          JSON.stringify(activities)
        );


        // ==========================================
        // UPDATE OVERALL
        // ==========================================

        updateOverallProgress();


      }, 600);

    }


    // ==========================================
    // UPDATE OVERALL PROGRESS
    // ==========================================

    function updateOverallProgress() {


      const tutor =
        getProgress(
          "tutorProgress"
        );


      const summarizer =
        getProgress(
          "summarizerProgress"
        );


      const quiz =
        getProgress(
          "quizProgress"
        );


      const planner =
        getProgress(
          "plannerProgress"
        );


      const flashcards =
        getProgress(
          "flashcardProgress"
        );


      const pdf =
        getProgress(
          "pdfProgress"
        );


      // ==========================================
      // STUDY LIBRARY
      // ==========================================

      const libraryResources =
        JSON.parse(
          localStorage.getItem(
            "studyLibrary"
          ) || "[]"
        );


      let libraryProgress = 0;


      if (
        libraryResources.length > 0
      ) {

        libraryProgress =
          Math.min(
            libraryResources.length * 20,
            100
          );

      }


      // ==========================================
      // OVERALL
      // ==========================================

      const overall =
        Math.round(
          (
            tutor +
            summarizer +
            quiz +
            planner +
            flashcards +
            pdf +
            libraryProgress
          ) / 7
        );


      localStorage.setItem(
        "overallProgress",
        overall
      );

    }


    // ==========================================
    // GET PROGRESS
    // ==========================================

    function getProgress(key) {

      return Math.min(
        Number(
          localStorage.getItem(key)
        ) || 0,
        100
      );

    }


  </script>


</body>

</html>
