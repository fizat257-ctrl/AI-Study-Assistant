<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Study Assistant - Voice Study Assistant</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f1115;
      color: white;
    }

    header {
      padding: 20px 30px;
      border-bottom: 1px solid #292d36;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #a8afbf;
    }

    .voice-card {
      background: #181b21;
      border: 1px solid #292d36;
      border-radius: 16px;
      padding: 30px;
    }

    .voice-button {
      display: block;

      margin: 10px auto 20px;

      width: 90px;
      height: 90px;

      border: none;
      border-radius: 50%;

      background: #2563eb;
      color: white;

      font-size: 35px;

      cursor: pointer;
    }

    .voice-button:hover {
      opacity: 0.9;
    }

    .voice-button.listening {
      background: #dc2626;
    }

    .voice-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: #a8afbf;
      margin-bottom: 20px;
    }

    .box {
      margin-top: 20px;
      padding: 20px;

      background: #101217;

      border: 1px solid #292d36;

      border-radius: 10px;

      line-height: 1.7;

      min-height: 100px;

      white-space: pre-wrap;
    }

    .box h3 {
      margin-bottom: 10px;
    }

    .clear-btn {
      width: 100%;

      margin-top: 15px;

      padding: 12px;

      border: 1px solid #363b46;

      border-radius: 9px;

      background: #181b21;

      color: white;

      cursor: pointer;
    }

    .clear-btn:hover {
      border-color: #2563eb;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      header {
        padding: 17px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 30px 15px;
      }

      .intro h2 {
        font-size: 26px;
      }

      .voice-card {
        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       HEADER
  =========================================== -->

  <header>

    <h1>
      🎓 AI Study Assistant
    </h1>

    <button
      class="back-btn"
      type="button"
      onclick="window.location.href='dashboard.html'"
    >
      ← Dashboard
    </button>

  </header>


  <!-- ==========================================
       MAIN
  =========================================== -->

  <main class="container">


    <section class="intro">

      <h2>
        🎤 Voice Study Assistant
      </h2>

      <p>
        Ask your study question using your voice.
      </p>

    </section>


    <section class="voice-card">


      <!-- ======================================
           MICROPHONE
      ======================================= -->

      <button
        id="voiceButton"
        class="voice-button"
        type="button"
        onclick="startVoice()"
      >
        🎤
      </button>


      <!-- ======================================
           STATUS
      ======================================= -->

      <div
        id="voiceStatus"
        class="status"
      >
        Click the microphone and start speaking.
      </div>


      <!-- ======================================
           QUESTION
      ======================================= -->

      <div class="box">

        <h3>
          🗣️ Your Question
        </h3>

        <div id="questionText">
          Your voice question will appear here.
        </div>

      </div>


      <!-- ======================================
           AI ANSWER
      ======================================= -->

      <div class="box">

        <h3>
          🤖 AI Answer
        </h3>

        <div id="answerText">
          Your answer will appear here.
        </div>

      </div>


      <!-- ======================================
           CLEAR
      ======================================= -->

      <button
        class="clear-btn"
        type="button"
        onclick="clearVoice()"
      >
        Clear
      </button>


    </section>

  </main>


  <script>

    // ==========================================
    // SPEECH RECOGNITION
    // ==========================================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition = null;


    // ==========================================
    // CREATE SPEECH RECOGNITION
    // ==========================================

    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();

      recognition.continuous = false;

      recognition.interimResults = false;

      recognition.lang = "en-US";


      // ========================================
      // WHEN LISTENING STARTS
      // ========================================

      recognition.onstart =
        function () {

          const button =
            document.getElementById(
              "voiceButton"
            );

          const status =
            document.getElementById(
              "voiceStatus"
            );


          button.classList.add(
            "listening"
          );

          button.disabled = true;

          status.textContent =
            "🎤 Listening... Speak now.";

        };


      // ========================================
      // WHEN SPEECH IS RECEIVED
      // ========================================

      recognition.onresult =
        function (event) {

          const transcript =
            event
              .results[0][0]
              .transcript
              .trim();


          if (!transcript) {

            document
              .getElementById("voiceStatus")
              .textContent =
              "❌ No question detected. Please try again.";

            return;

          }


          document
            .getElementById("questionText")
            .textContent =
            transcript;


          document
            .getElementById("voiceStatus")
            .textContent =
            "🤖 AI is preparing your answer...";


          getVoiceAnswer(
            transcript
          );

        };


      // ========================================
      // SPEECH ERROR
      // ========================================

      recognition.onerror =
        function (event) {

          console.error(
            "Speech recognition error:",
            event.error
          );


          const status =
            document.getElementById(
              "voiceStatus"
            );


          if (
            event.error ===
            "not-allowed"
          ) {

            status.textContent =
              "❌ Microphone permission was denied.";

          }

          else if (
            event.error ===
            "no-speech"
          ) {

            status.textContent =
              "❌ No speech detected. Please try again.";

          }

          else {

            status.textContent =
              "❌ Could not hear your question. Please try again.";

          }

        };


      // ========================================
      // SPEECH ENDED
      // ========================================

      recognition.onend =
        function () {

          const button =
            document.getElementById(
              "voiceButton"
            );


          button.classList.remove(
            "listening"
          );

          button.disabled = false;

        };

    }


    // ==========================================
    // START VOICE
    // ==========================================

    function startVoice() {

      if (!recognition) {

        document
          .getElementById("voiceStatus")
          .textContent =
          "❌ Voice recognition is not supported in this browser.";

        return;

      }


      document
        .getElementById("answerText")
        .textContent =
        "Waiting for your question...";


      document
        .getElementById("voiceStatus")
        .textContent =
        "🎤 Starting microphone...";


      try {

        recognition.start();

      }

      catch (error) {

        console.error(
          "Voice start error:",
          error
        );

      }

    }


    // ==========================================
    // SEND QUESTION DIRECTLY TO AI API
    // ==========================================

    async function getVoiceAnswer(question) {

      const answerBox =
        document.getElementById(
          "answerText"
        );

      const status =
        document.getElementById(
          "voiceStatus"
        );


      // ----------------------------------------
      // SHOW THINKING
      // ----------------------------------------

      answerBox.textContent =
        "🤖 AI Study Assistant is thinking...";


      try {

        console.log(
          "Sending voice question:",
          question
        );


        // --------------------------------------
        // CALL BACKEND
        // --------------------------------------

        const response =
          await fetch(
            "/api/study",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                question:
                  question

              })

            }
          );


        // --------------------------------------
        // READ RESPONSE
        // --------------------------------------

        let data;


        try {

          data =
            await response.json();

        }

        catch (jsonError) {

          throw new Error(
            "Server returned an invalid response."
          );

        }


        console.log(
          "Voice AI response:",
          data
        );


        // --------------------------------------
        // API ERROR
        // --------------------------------------

        if (!response.ok) {

          throw new Error(

            data.error ||

            data.message ||

            `Server error ${response.status}`

          );

        }


        // --------------------------------------
        // CHECK SUCCESS
        // --------------------------------------

        if (
          !data.success
        ) {

          throw new Error(

            data.error ||

            "AI could not generate an answer."

          );

        }


        // --------------------------------------
        // GET ANSWER
        // --------------------------------------

        const answer =
          data.answer;


        if (
          !answer ||
          !String(answer).trim()
        ) {

          throw new Error(
            "AI returned an empty answer."
          );

        }


        // --------------------------------------
        // SHOW ANSWER
        // --------------------------------------

        answerBox.textContent =
          String(answer).trim();


        status.textContent =
          "✅ AI answer generated.";


        // --------------------------------------
        // SAVE VOICE PROGRESS
        // --------------------------------------

        localStorage.setItem(
          "voiceProgress",
          "100"
        );


        // --------------------------------------
        // SAVE ACTIVITY
        // --------------------------------------

        let activities =
          JSON.parse(
            localStorage.getItem(
              "studyActivity"
            ) || "[]"
          );


        activities.push({

          icon: "🎤",

          text:
            "Voice Study Question: " +
            question,

          time:
            new Date().toLocaleString()

        });


        if (
          activities.length > 20
        ) {

          activities =
            activities.slice(-20);

        }


        localStorage.setItem(
          "studyActivity",
          JSON.stringify(
            activities
          )
        );


      }

      catch (error) {

        console.error(
          "VOICE AI ERROR:",
          error
        );


        answerBox.textContent =
          "❌ Sorry, I could not generate the answer.\n\n" +
          String(
            error.message ||
            "Unknown error."
          );


        status.textContent =
          "❌ AI answer could not be generated.";

      }

    }


    // ==========================================
    // CLEAR
    // ==========================================

    function clearVoice() {

      document
        .getElementById("questionText")
        .textContent =
        "Your voice question will appear here.";


      document
        .getElementById("answerText")
        .textContent =
        "Your answer will appear here.";


      document
        .getElementById("voiceStatus")
        .textContent =
        "Click the microphone and start speaking.";

    }

  </script>


</body>

</html>
