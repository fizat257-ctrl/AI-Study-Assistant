<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Study Assistant - AI Tutor</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            background: #0f1115;
            color: white;
        }


        header {
            padding: 20px 30px;

            border-bottom: 1px solid #292d36;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        header h1 {
            font-size: 22px;
        }


        .back-btn {
            border: none;

            background: #2563eb;

            color: white;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;
        }


        .back-btn:hover {
            opacity: 0.9;
        }


        .container {
            max-width: 900px;

            margin: auto;

            padding: 45px 20px;
        }


        .intro {
            text-align: center;

            margin-bottom: 35px;
        }


        .intro h2 {
            font-size: 32px;

            margin-bottom: 10px;
        }


        .intro p {
            color: #a8afbf;

            font-size: 16px;
        }


        .tutor-card {
            background: #181b21;

            border: 1px solid #292d36;

            border-radius: 16px;

            padding: 30px;
        }


        textarea {
            width: 100%;

            min-height: 150px;

            resize: vertical;

            padding: 15px;

            border: 1px solid #363b46;

            border-radius: 10px;

            background: #101217;

            color: white;

            font-size: 16px;

            line-height: 1.6;

            outline: none;
        }


        textarea:focus {
            border-color: #2563eb;
        }


        textarea::placeholder {
            color: #6b7280;
        }


        .ask-btn {
            width: 100%;

            margin-top: 15px;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .ask-btn:hover {
            opacity: 0.9;
        }


        .ask-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        .answer-section {
            margin-top: 30px;
        }


        .answer-section h3 {
            margin-bottom: 12px;

            font-size: 20px;
        }


        .answer {
            min-height: 150px;

            padding: 20px;

            background: #101217;

            border: 1px solid #292d36;

            border-radius: 10px;

            color: #d7dbe4;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-wrap: break-word;
        }


        .progress-note {
            margin-top: 20px;

            padding: 14px;

            background: #111827;

            border: 1px solid #1f2937;

            border-radius: 9px;

            color: #9ca3af;

            font-size: 14px;

            text-align: center;
        }


        @media (max-width: 600px) {

            header {
                padding: 17px;
            }


            header h1 {
                font-size: 18px;
            }


            .container {
                padding: 30px 15px;
            }


            .intro h2 {
                font-size: 26px;
            }


            .tutor-card {
                padding: 20px;
            }


            textarea {
                min-height: 130px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header>

        <h1>
            🤖 AI Study Assistant
        </h1>


        <button
            class="back-btn"
            type="button"
            onclick="window.location.href='dashboard.html'"
        >
            ← Dashboard
        </button>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="container">


        <!-- INTRO -->

        <section class="intro">

            <h2>
                🤖 AI Tutor
            </h2>


            <p>
                Ask any study question and get a simple,
                accurate explanation from AI.
            </p>

        </section>



        <!-- ==================================================
             TUTOR CARD
        ================================================== -->

        <section class="tutor-card">


            <!-- QUESTION -->

            <textarea
                id="question"
                placeholder="Example: What is friction?"
                autocomplete="off"
            ></textarea>



            <!-- ASK BUTTON -->

            <button
                class="ask-btn"
                id="askButton"
                type="button"
                onclick="askAssistant()"
            >
                Ask AI
            </button>



            <!-- ==================================================
                 ANSWER
            ================================================== -->

            <div class="answer-section">

                <h3>
                    AI Answer
                </h3>


                <div
                    id="answer"
                    class="answer"
                >
                    Your AI answer will appear here.
                </div>

            </div>



            <!-- ==================================================
                 PROGRESS
            ================================================== -->

            <div class="progress-note">

                📊 Your AI Tutor questions will automatically
                appear in Study Progress.

            </div>


        </section>


    </main>



    <!-- ==================================================
         AI TUTOR JAVASCRIPT
    ================================================== -->

    <script src="script.js"></script>



    <!-- ==================================================
         ENTER KEY SUPPORT
    ================================================== -->

    <script>

        const questionInput =
            document.getElementById("question");


        if (questionInput) {

            questionInput.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        if (
                            typeof askAssistant ===
                            "function"
                        ) {

                            askAssistant();

                        }

                    }

                }
            );

        }

    </script>


</body>

</html>
